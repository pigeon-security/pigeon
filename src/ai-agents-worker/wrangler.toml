name = "pigeon-ai-agents"
account_id = "4f94676cb2cbe46fd985b089ca97ea27"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"
# A capability Worker (docs/plans/workers-split.md, docs/plans/ai-agents.md): no public surface.
# Core (pigeon-platform) reaches it over a service binding, and it reaches core over PLATFORM.
workers_dev = false
preview_urls = false

# Cloudflare Observability (docs/plans/observability.md). Every Worker carries this same block;
# the smoke scenario core_observability_on_every_worker fails when one does not.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
# The per-request log keeps each URL whole, and some URLs carry one-use codes
# (/auth/enrol?code=, OAuth callbacks): off. console lines are still kept.
invocation_logs = false

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[build]
command = "cargo install -q worker-build@0.9.0 && worker-build --release"

[vars]
CF_ACCOUNT_ID = "4f94676cb2cbe46fd985b089ca97ea27"

# The key core signs callers with, made once by core's `workers_setup`.
[[secrets_store_secrets]]
binding = "CALLER_KEY"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "CALLER_KEY"

# Core: its tools through its gate (models, CI, the policy), as each run's caller.
[[services]]
binding = "PLATFORM"
service = "pigeon-platform"

[durable_objects]
bindings = [
  { name = "AI_AGENT_RUNS", class_name = "AiAgentRuns" },
  { name = "SANDBOXES", class_name = "Sandbox" },
]

# Runs: an index object and one object per run, whose alarm takes the run's steps.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AiAgentRuns", "Sandbox"]

# A run's sandbox: the CI base image with pigeon-sandboxd (ci/sandbox/Dockerfile). The image's
# digest is pinned: v2's linux/amd64 manifest, built and pushed by the person from 23afd44
# (docs/plans/sandbox-v2.md).
# First deployed by its own landing, once core's map listed this Worker (the Lander reads
# lanes from main, so the landing that adds a Worker's entry cannot deploy it).
[[containers]]
class_name = "Sandbox"
scheduling_policy = "durable_object"

[containers.images.sandbox]
image = "registry.cloudflare.com/4f94676cb2cbe46fd985b089ca97ea27/pigeon-ai-agent-sandbox@sha256:4d913d674922fea46c61ae8a63103b821b67deeb40086838570047c2ff74bf88"

# Container logs off: the top-level [observability] would otherwise keep this container's
# output, which may hold what a job or run printed (docs/plans/observability.md).
[containers.observability]
enabled = false
