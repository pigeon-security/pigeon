name = "pigeon-platform"
account_id = "4f94676cb2cbe46fd985b089ca97ea27"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"
# Served on platform.pigeon.dev, proxy.pigeon.dev and the apex pigeon.dev, routed by host in
# src/lib.rs. Each is a Workers Custom Domain attached by its setup tool (setup_platform,
# setup_proxy_host, site_publish), not a route here: wrangler's route calls are outside the
# /cf/ allowlist, and a deploy keeps the custom domains as they are.
workers_dev = false
preview_urls = false

[build]
command = "cargo install -q worker-build@0.9.0 && worker-build --release"

[vars]
CF_ACCOUNT_ID = "4f94676cb2cbe46fd985b089ca97ea27"
CF_SECRETS_STORE_ID = "5185c227b9f34b4291045175695b78ec"
ZONE = "pigeon.dev"
PLATFORM_HOST = "platform.pigeon.dev"

# The parent token: Account API Tokens Write, nothing else.
[[secrets_store_secrets]]
binding = "CF_PARENT_TOKEN"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "CF_PARENT_TOKEN"

# The GitHub mirror's push token: a fine-grained PAT on pigeon-security/pigeon only.
[[secrets_store_secrets]]
binding = "GITHUB_MIRROR_TOKEN"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "GITHUB_MIRROR_TOKEN"

# The CI gateway's Buildkite connector: an API token (read_builds, write_builds) and its
# pipeline webhook's token. Both are set on the secrets page.
[[secrets_store_secrets]]
binding = "BUILDKITE_API_TOKEN"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "BUILDKITE_API_TOKEN"

[[secrets_store_secrets]]
binding = "BUILDKITE_WEBHOOK_TOKEN"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "BUILDKITE_WEBHOOK_TOKEN"

# Artifacts push events reach this Worker through the pigeon-source-events queue; the queue
# and its consumer are set up by POST /setup/source, not here.

# The Directory: users, passkeys and links, in one Durable Object with SQLite storage. The CI
# scheduler: every CI job, in one Durable Object with SQLite storage and an alarm.
[durable_objects]
bindings = [
  { name = "DIRECTORY", class_name = "Directory" },
  { name = "CI_SCHEDULER", class_name = "CiScheduler" },
  { name = "CI_RUNNER", class_name = "CiRunner" },
  { name = "MODEL_JOBS", class_name = "ModelJobs" },
  { name = "LANDER", class_name = "Lander" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Directory"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CiScheduler"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CiRunner"]

# Async model jobs: an index object and one object per job, which streams from its alarm.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["ModelJobs"]

# Landings: one object, whose alarm follows the live landing.
[[migrations]]
tag = "v5"
new_sqlite_classes = ["Lander"]

# CI job containers: one per job attempt, held by a CiRunner object, which picks the image and
# the instance size on each start. The base image carries git, curl, coreutils, sh, a Rust
# toolchain and the runner (ci/runner/entrypoint.sh) as /usr/local/bin/pigeon-ci-runner.
[[containers]]
class_name = "CiRunner"
scheduling_policy = "durable_object"

[containers.images.base]
image = "registry.cloudflare.com/4f94676cb2cbe46fd985b089ca97ea27/pigeon-ci-base@sha256:02b7487373a845ae84c7ae631ba5c33b5b887d3d154ab2aba0f244ba2ac861a6"

# CI state changes, for other capabilities. The queue must exist before this deploys.
[[queues.producers]]
binding = "CI_EVENTS"
queue = "pigeon-ci-events"
