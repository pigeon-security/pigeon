name = "pigeon-platform"
account_id = "4f94676cb2cbe46fd985b089ca97ea27"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"
# Served on platform.pigeon.dev, proxy.pigeon.dev and the apex pigeon.dev, routed by host in
# src/lib.rs. Each is a Workers Custom Domain attached by its setup tool (setup_platform,
# setup_proxy_host, site_publish), not a route here: wrangler's route calls are outside the
# /cf/ allowlist, and a deploy keeps the custom domains as they are.
workers_dev = false
preview_urls = false

# Cloudflare Observability (docs/plans/observability.md). Every Worker carries this same block;
# the smoke scenario core_observability_on_every_worker fails when one does not.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
# The per-request log keeps each URL whole, and some URLs carry one-use codes
# (/auth/enrol?code=, OAuth callbacks): off. console lines are still kept.
invocation_logs = false

[observability.traces]
# Off in core only: it serves the enrolment and OAuth URLs, whose codes sit in the query
# string, and traces keep the incoming request's url.query.
enabled = false
head_sampling_rate = 0.1

[build]
command = "cargo install -q worker-build@0.9.0 && worker-build --release"

# Every minute: push-started site deploys that wait or were cut off (github::run_pending).
[triggers]
crons = ["* * * * *"]

[vars]
CF_ACCOUNT_ID = "4f94676cb2cbe46fd985b089ca97ea27"
CF_SECRETS_STORE_ID = "5185c227b9f34b4291045175695b78ec"
ZONE = "pigeon.dev"
PLATFORM_HOST = "platform.pigeon.dev"
# The GitHub App pigeon reads instances' repositories as (not secret; its key is).
GITHUB_APP_ID = "5869577"
GITHUB_APP_CLIENT_ID = "Iv23liHG7HdcPPzrnNfn"

# The parent token: Account API Tokens Write, nothing else.
[[secrets_store_secrets]]
binding = "CF_PARENT_TOKEN"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "CF_PARENT_TOKEN"

# The GitHub mirror's push token: a fine-grained PAT on pigeon-security/pigeon only.
[[secrets_store_secrets]]
binding = "GITHUB_MIRROR_TOKEN"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "GITHUB_MIRROR_TOKEN"

# The CI gateway's Buildkite connector: the one Buildkite API token, set on the secrets page,
# for the setup, the connector and the portal's Buildkite server (docs/plans/buildkite-mcp.md).
[[secrets_store_secrets]]
binding = "BUILDKITE_API_TOKEN"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "BUILDKITE_API_TOKEN"

# Linked accounts (src/capabilities/src/linked.rs): the Cloudflare OAuth client's secret and the
# key that seals each link's tokens. linked_setup writes both to the Secrets Store; the bindings
# come after, since a binding to a secret that does not exist fails the deploy.
[[secrets_store_secrets]]
binding = "CF_OAUTH_CLIENT_SECRET"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "CF_OAUTH_CLIENT_SECRET"

[[secrets_store_secrets]]
binding = "LINK_KEY"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "LINK_KEY"

# The key that signs the caller core forwards to its capability Workers, made by workers_setup
# (docs/plans/workers-split.md).
[[secrets_store_secrets]]
binding = "CALLER_KEY"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "CALLER_KEY"

# Each capability Worker's own caller key, made by workers_setup (docs/plans/caller-keys.md,
# step 2). Core checks a request naming a Worker in X-Pigeon-Worker with that Worker's key first,
# then CALLER_KEY. The binding names are split::WORKER_KEYS.
[[secrets_store_secrets]]
binding = "CALLER_KEY_SITES"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "CALLER_KEY_SITES"

[[secrets_store_secrets]]
binding = "CALLER_KEY_CI_GATEWAY"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "CALLER_KEY_CI_GATEWAY"

[[secrets_store_secrets]]
binding = "CALLER_KEY_MODEL_GATEWAY"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "CALLER_KEY_MODEL_GATEWAY"

[[secrets_store_secrets]]
binding = "CALLER_KEY_CLOUD_GATEWAY"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "CALLER_KEY_CLOUD_GATEWAY"

[[secrets_store_secrets]]
binding = "CALLER_KEY_AI_AGENTS"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "CALLER_KEY_AI_AGENTS"

[[secrets_store_secrets]]
binding = "CALLER_KEY_PROXY"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "CALLER_KEY_PROXY"

# The capability Workers: their tools join this Worker's from their manifests
# (settings::BINDINGS). A binding's Worker must exist before this deploys.
[[services]]
binding = "SITES"
service = "pigeon-sites"

[[services]]
binding = "MODELS"
service = "pigeon-model-gateway"

[[services]]
binding = "CI"
service = "pigeon-ci-gateway"

# The AI agents Worker (docs/plans/ai-agents.md): deployed by landing 1, bound here after.
[[services]]
binding = "AI_AGENTS"
service = "pigeon-ai-agents"

# The cloud gateway Worker (docs/plans/cloud-gateway.md): deployed by its first landing, bound
# here after. Its tools answer "Scaleway is not set up" until the person sets the Scaleway slots.
[[services]]
binding = "CLOUD"
service = "pigeon-cloud-gateway"

# The GitHub App (src/capabilities/src/github.rs): its private key and webhook secret, set by the
# person on the app's Access page (Credentials); bound once they exist, since a binding to a missing secret fails the
# deploy.
[[secrets_store_secrets]]
binding = "GITHUB_APP_PRIVATE_KEY"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "GITHUB_APP_PRIVATE_KEY"

[[secrets_store_secrets]]
binding = "GITHUB_APP_WEBHOOK_SECRET"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "GITHUB_APP_WEBHOOK_SECRET"

# Artifacts push events reach this Worker through the pigeon-source-events queue; the queue
# and its consumer are set up by POST /setup/source, not here.

# The Directory: users, passkeys and links, in one Durable Object with SQLite storage. The CI
# scheduler (every CI job, with an alarm) moved to pigeon-ci-gateway and the model job objects
# to pigeon-model-gateway (transferred_classes): once a class has moved, a binding here must name
# the Worker that hosts it, or Cloudflare refuses the upload (10061). This Worker keeps both
# classes' migrations and exports. The CI runners, which hold the job containers, are still
# this Worker's.
[durable_objects]
bindings = [
  { name = "DIRECTORY", class_name = "Directory" },
  { name = "CI_SCHEDULER", class_name = "CiScheduler", script_name = "pigeon-ci-gateway" },
  { name = "CI_RUNNER", class_name = "CiRunner" },
  { name = "MODEL_JOBS", class_name = "ModelJobs", script_name = "pigeon-model-gateway" },
  { name = "LANDER", class_name = "Lander" },
  { name = "TOKEN_LEDGER", class_name = "TokenLedger" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Directory"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CiScheduler"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CiRunner"]

# Async model jobs: an index object and one object per job, which streams from its alarm.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["ModelJobs"]

# Landings: one object, whose alarm follows the live landing.
[[migrations]]
tag = "v5"
new_sqlite_classes = ["Lander"]

# The token ledger: one object holding the shared Cloudflare tokens' ids (never their values).
[[migrations]]
tag = "v6"
new_sqlite_classes = ["TokenLedger"]

# CI job containers: one per job attempt, held by a CiRunner object, which picks the image and
# the instance size on each start. The base image carries git, curl, coreutils, sh, a Rust
# toolchain and the runner (ci/runner/entrypoint.sh) as /usr/local/bin/pigeon-ci-runner.
[[containers]]
class_name = "CiRunner"
scheduling_policy = "durable_object"

[containers.images.base]
image = "registry.cloudflare.com/4f94676cb2cbe46fd985b089ca97ea27/pigeon-ci-base@sha256:02b7487373a845ae84c7ae631ba5c33b5b887d3d154ab2aba0f244ba2ac861a6"

# Container logs off: the top-level [observability] would otherwise keep this container's
# output, which may hold what a job or run printed (docs/plans/observability.md).
[containers.observability]
enabled = false

# CI state changes, for other capabilities. The queue must exist before this deploys.
[[queues.producers]]
binding = "CI_EVENTS"
queue = "pigeon-ci-events"

# The changelog of main (src/capabilities/src/changelog.rs, docs/plans/changelog.md): its bucket,
# read and written through this binding instead of short-lived R2 API tokens. Bound once the
# bucket existed (made by the first run, 2026-11-22), since a binding to a missing bucket fails
# the deploy.
[[r2_buckets]]
binding = "CHANGELOG"
bucket_name = "pigeon-changelog"

# The home instance's landing site (src/capabilities/src/site.rs, docs/plans/platform-self-hosting.md
# S1): the apex serves the release `live` names in this bucket, read through this binding with no
# token; core writes it only with a minted instance_home token (instances/home_site.rs). The
# bucket exists (the home instance's releases are in it), since a binding to a missing bucket
# fails the deploy.
[[r2_buckets]]
binding = "HOME_SITE"
bucket_name = "pigeon-platform-site"

# App Store Connect (src/capabilities/src/apple.rs, docs/plans/ios.md phase 1b): the team id,
# the API key's issuer id, key id and .p8, set by the person on the secrets page; bound once all
# four existed, since a binding to a missing secret fails the deploy.
[[secrets_store_secrets]]
binding = "APPLE_TEAM_ID"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "APPLE_TEAM_ID"

[[secrets_store_secrets]]
binding = "APPLE_ASC_ISSUER_ID"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "APPLE_ASC_ISSUER_ID"

[[secrets_store_secrets]]
binding = "APPLE_ASC_KEY_ID"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "APPLE_ASC_KEY_ID"

[[secrets_store_secrets]]
binding = "APPLE_ASC_KEY"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "APPLE_ASC_KEY"

# The APNs provider key (src/capabilities/src/apple.rs, docs/plans/ios.md phase 6b): its key id
# and .p8, set by the person; bound once both existed. Core only.
[[secrets_store_secrets]]
binding = "APNS_KEY_ID"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "APNS_KEY_ID"

[[secrets_store_secrets]]
binding = "APNS_KEY"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "APNS_KEY"

# Seals the distribution keys pigeon makes (docs/plans/ios.md, phase 2). pigeon made it on the
# first press of "Create signing identity"; no one types it.
[[secrets_store_secrets]]
binding = "APPLE_SEAL_KEY"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "APPLE_SEAL_KEY"
