name = "pigeon-platform"
account_id = "4f94676cb2cbe46fd985b089ca97ea27"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"
# Served only on platform.pigeon.dev, behind Access.
workers_dev = false
preview_urls = false

[build]
command = "cargo install -q worker-build@0.9.0 && worker-build --release"

[vars]
CF_ACCOUNT_ID = "4f94676cb2cbe46fd985b089ca97ea27"
CF_SECRETS_STORE_ID = "5185c227b9f34b4291045175695b78ec"
ZONE = "pigeon.dev"
PLATFORM_HOST = "platform.pigeon.dev"

# The parent token: Account API Tokens Write, nothing else.
[[secrets_store_secrets]]
binding = "CF_PARENT_TOKEN"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "CF_PARENT_TOKEN"

# The GitHub mirror's push token: a fine-grained PAT on pigeon-security/pigeon only.
[[secrets_store_secrets]]
binding = "GITHUB_MIRROR_TOKEN"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "GITHUB_MIRROR_TOKEN"

# Artifacts push events reach this Worker through the pigeon-source-events queue; the queue
# and its consumer are set up by POST /setup/source, not here.
