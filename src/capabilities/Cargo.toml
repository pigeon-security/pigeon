[package]
name = "pigeon-capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pigeon-core = { path = "../core" }
pigeon-ci = { path = "../ci" }
pigeon-contract = { path = "../contract" }
pigeon-models = { path = "../models" }
pigeon-proxies = { path = "../proxies" }
pigeon-ingest = { path = "../ingest" }
worker = { version = "0.9.0", features = ["queue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
wasm-streams = "0.7"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
pigeon-ai-agents = { path = "../ai-agents" }
pigeon-blog = { path = "../blog" }
pigeon-email = { path = "../email" }
pigeon-ingest-runner = { path = "../ingest-runner" }
rsa = { version = "0.9", default-features = false, features = ["std"] }
sha2 = "0.10"
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
rand = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# The smoke suite, pigeon's only tests: one end-to-end scenario per path, through public
# interfaces with stubbed externals. The root declares one module
# per area in tests/smoke/. See ci/runner/test.sh.
[[test]]
name = "smoke"
path = "../../tests/smoke.rs"
