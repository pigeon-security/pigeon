name = "pigeon-ci-gateway"
account_id = "4f94676cb2cbe46fd985b089ca97ea27"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"
# A capability Worker (docs/plans/workers-split.md): no public surface. Core (pigeon-platform)
# reaches it over a service binding, and it reaches core over PLATFORM. Nothing routes here
# from the internet; core forwards /ci/ to it once core binds it.
workers_dev = false
preview_urls = false

[build]
command = "cargo install -q worker-build@0.9.0 && worker-build --release"

[vars]
CF_ACCOUNT_ID = "4f94676cb2cbe46fd985b089ca97ea27"
CF_SECRETS_STORE_ID = "5185c227b9f34b4291045175695b78ec"

# The key core signs callers with, made once by core's `workers_setup`.
[[secrets_store_secrets]]
binding = "CALLER_KEY"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "CALLER_KEY"

# The Buildkite connector's one API token, set on core's secrets page.
[[secrets_store_secrets]]
binding = "BUILDKITE_API_TOKEN"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "BUILDKITE_API_TOKEN"

# Core: scoped credentials for the call in hand, and its tools through its gate.
[[services]]
binding = "PLATFORM"
service = "pigeon-platform"

# The CI scheduler: every CI job, in one object with SQLite storage and an alarm. Its class
# moves here from pigeon-platform on this config's first deploy, with its rows and alarm
# (rehearsed with pigeon-dotest-a and -b: docs/plans/do-rehearsal.md). It is never created here
# first, and a transfer cannot be rolled back. pigeon-platform keeps its v2 migration and still
# exports the class; its CI_SCHEDULER binding reaches the class here. The runners, which hold
# the job containers, stay core's: a container class cannot be transferred, and the deploy job
# that makes this transfer runs in one of them.
[durable_objects]
bindings = [
  { name = "CI_SCHEDULER", class_name = "CiScheduler" },
  { name = "CI_RUNNER", class_name = "CiRunner", script_name = "pigeon-platform" },
]

[[migrations]]
tag = "v1"

[[migrations.transferred_classes]]
from = "CiScheduler"
from_script = "pigeon-platform"
to = "CiScheduler"

# CI state changes, for other capabilities; core consumes them.
[[queues.producers]]
binding = "CI_EVENTS"
queue = "pigeon-ci-events"
