name = "pigeon-proxy"
account_id = "4f94676cb2cbe46fd985b089ca97ea27"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"
# The proxies (`/git/`, `/cf/`) on proxy.pigeon.dev (docs/plans/workers-split.md, phase 6). The
# one platform Worker other than core with a public hostname: a Workers Custom Domain, attached
# by core's `setup_proxy_host` once settings::PROXY_WORKER names this Worker, not a route here.
# It never holds the parent token: it asks core over PLATFORM for scoped credentials and for
# who holds a credential.
workers_dev = false
preview_urls = false

# Cloudflare Observability (docs/plans/observability.md). Every Worker carries this same block;
# the smoke scenario core_observability_on_every_worker fails when one does not.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
# The per-request log keeps each URL whole, and some URLs carry one-use codes
# (/auth/enrol?code=, OAuth callbacks): off. console lines are still kept.
invocation_logs = false

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[build]
command = "cargo install -q worker-build@0.9.0 && worker-build --release"

[vars]
CF_ACCOUNT_ID = "4f94676cb2cbe46fd985b089ca97ea27"
CF_SECRETS_STORE_ID = "5185c227b9f34b4291045175695b78ec"
ZONE = "pigeon.dev"
PLATFORM_HOST = "platform.pigeon.dev"
# The one hostname this Worker answers on.
PROXY_HOST = "proxy.pigeon.dev"

# The key core signs callers with, made once by core's `workers_setup`; this Worker signs its
# requests to core with it.
[[secrets_store_secrets]]
binding = "CALLER_KEY"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "CALLER_KEY"

# Core: scoped credentials (`credential`), and who holds a proxy credential or job token
# (`verify`, `grant`, `deploy_grant`).
[[services]]
binding = "PLATFORM"
service = "pigeon-platform"
