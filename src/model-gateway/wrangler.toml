name = "pigeon-model-gateway"
account_id = "4f94676cb2cbe46fd985b089ca97ea27"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"
# A capability Worker (docs/plans/workers-split.md): no public surface. Core (pigeon-platform)
# reaches it over a service binding, and it reaches core over PLATFORM. Nothing routes here
# from the internet.
workers_dev = false
preview_urls = false

# Cloudflare Observability (docs/plans/observability.md). Every Worker carries this same block;
# the smoke scenario core_observability_on_every_worker fails when one does not.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
# The per-request log keeps each URL whole, and some URLs carry one-use codes
# (/auth/enrol?code=, OAuth callbacks): off. console lines are still kept.
invocation_logs = false

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[build]
command = "cargo install -q worker-build@0.9.0 && worker-build --release"

[vars]
CF_ACCOUNT_ID = "4f94676cb2cbe46fd985b089ca97ea27"
CF_SECRETS_STORE_ID = "5185c227b9f34b4291045175695b78ec"

# The key core signs callers with, made once by core's `workers_setup`.
[[secrets_store_secrets]]
binding = "CALLER_KEY"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "CALLER_KEY"

# This Worker's own caller key, CALLER_KEY_MODEL_GATEWAY, made by core's `workers_setup`
# (docs/plans/caller-keys.md, step 2). Bound now and not yet read: this Worker still signs with
# CALLER_KEY until step 3.
[[secrets_store_secrets]]
binding = "CALLER_KEY_OWN"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "CALLER_KEY_MODEL_GATEWAY"

# Core: short-lived Cloudflare credentials for the call in hand, and its tools through its gate.
[[services]]
binding = "PLATFORM"
service = "pigeon-platform"

# The model job objects. The class moves here from pigeon-platform on this config's first
# deploy, with its objects and their rows and alarms (rehearsed with pigeon-dotest-a and -b:
# docs/plans/do-rehearsal.md). It is never created here first, and a transfer cannot be rolled
# back. pigeon-platform keeps its v4 migration and still exports the class; its MODEL_JOBS
# binding reaches the class here.
[durable_objects]
bindings = [
  { name = "MODEL_JOBS", class_name = "ModelJobs" },
]

[[migrations]]
tag = "v1"

[[migrations.transferred_classes]]
from = "ModelJobs"
from_script = "pigeon-platform"
to = "ModelJobs"
