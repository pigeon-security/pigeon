[package]
name = "pigeon-data-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The data Worker an instance runs in its own Cloudflare account (docs/plans/data-worker.md),
# with only its ingest parts so far (docs/plans/ingest.md, decision 13). Not a platform Worker:
# not in ci/workers.toml and never deployed by a landing. See wrangler.example.toml.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pigeon-core = { path = "../core" }
pigeon-ingest = { path = "../ingest" }
serde_json = "1"
worker = { version = "0.9.0", features = ["d1", "queue"] }
