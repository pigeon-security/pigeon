[package]
name = "pigeon-data-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The data Worker an instance runs in its own Cloudflare account (docs/plans/data-worker.md):
# its ingest parts (docs/plans/ingest.md, decision 13) and the lite tier of the data store, with
# the email handler, the signed read ops and the B2 backup consumer (docs/plans/email.md). Not a
# platform Worker: listed under [checks] in ci/workers.toml and never deployed by a landing; an
# instance plan uploads it. See wrangler.example.toml.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pigeon-core = { path = "../core" }
pigeon-ingest = { path = "../ingest" }
pigeon-email = { path = "../email" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
worker = { version = "0.9.0", features = ["d1", "queue"] }
