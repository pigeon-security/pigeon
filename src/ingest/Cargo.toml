[package]
name = "pigeon-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Pure: no Worker runtime and no network. Builds for WASM (the data Worker, core) and natively
# (the ingest runner, the smoke suite). Design: docs/plans/ingest.md, decision 13.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false, features = ["compress"] }
blake3 = { version = "1", default-features = false, features = ["pure"] }
unicode-normalization = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
hmac = { version = "0.12", default-features = false }
