name = "pigeon-cloud-gateway"
account_id = "4f94676cb2cbe46fd985b089ca97ea27"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"
# A capability Worker (docs/plans/workers-split.md): no public surface. Core (pigeon-platform)
# reaches it over a service binding, and it reaches core over PLATFORM. Nothing routes here
# from the internet.
workers_dev = false
preview_urls = false

# Cloudflare Observability (docs/plans/observability.md). Every Worker carries this same block;
# the smoke scenario core_observability_on_every_worker fails when one does not.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
# The per-request log keeps each URL whole, and some URLs carry one-use codes
# (/auth/enrol?code=, OAuth callbacks): off. console lines are still kept.
invocation_logs = false

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[build]
command = "cargo install -q worker-build@0.9.0 && worker-build --release"

[vars]
CF_ACCOUNT_ID = "4f94676cb2cbe46fd985b089ca97ea27"
CF_SECRETS_STORE_ID = "5185c227b9f34b4291045175695b78ec"

# This Worker's own caller key, CALLER_KEY_CLOUD_GATEWAY, made by core's `workers_setup`
# (docs/plans/caller-keys.md, step 3). Core signs its calls here with it, and this Worker
# signs its requests to core with it; a missing one refuses both, with no fall-back.
[[secrets_store_secrets]]
binding = "CALLER_KEY_OWN"
store_id = "5185c227b9f34b4291045175695b78ec"
secret_name = "CALLER_KEY_CLOUD_GATEWAY"

# Core: short-lived Cloudflare credentials for the call in hand, and its tools through its gate.
[[services]]
binding = "PLATFORM"
service = "pigeon-platform"

# The Scaleway secrets (SCW_ACCESS_KEY, SCW_SECRET_KEY, SCW_DEFAULT_ORGANIZATION_ID,
# SCW_DEFAULT_PROJECT_ID) are not bound here yet. A binding to a secret that does not exist
# may stop a deploy, so the bindings land after the person sets the four secrets
# (docs/plans/cloud-gateway.md, phase 6). Until then every tool says Scaleway is not set up.
#
# No Durable Objects and no migrations: this Worker keeps no state of its own.
