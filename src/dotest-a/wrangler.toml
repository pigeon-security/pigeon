name = "pigeon-dotest-a"
account_id = "4f94676cb2cbe46fd985b089ca97ea27"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"
# A throwaway Worker for the Durable Object transfer rehearsal (docs/plans/do-rehearsal.md;
# docs/plans/workers-split.md, T17): the transfer's source. It holds no secrets and only dummy
# rows, so it answers on its workers.dev URL, behind a header that is a speed bump, not security.
workers_dev = true
preview_urls = false

# Cloudflare Observability (docs/plans/observability.md). Every Worker carries this same block;
# the smoke scenario core_observability_on_every_worker fails when one does not. Here it also
# keeps the cron's `dotest-state` lines, which `observability_errors` reads.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# The cron logs the object's state every five minutes (src/lib.rs, `scheduled`).
[triggers]
crons = ["*/5 * * * *"]

[build]
command = "cargo install -q worker-build@0.9.0 && worker-build --release"

# The class moved to pigeon-dotest-b (its `transferred_classes`): this binding reaches it there.
# After the transfer this Worker's upload is refused without script_name (10061, incident 5).
# It keeps its v1 migration, which created the class, and no longer exports the class. Never add
# `deleted_classes` for it: that would ask Cloudflare to delete the objects pigeon-dotest-b holds.
[durable_objects]
bindings = [
  { name = "PROBE", class_name = "Probe", script_name = "pigeon-dotest-b" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Probe"]
