[workspace]
resolver = "3"
members = [
    "src/core",
    "src/contract",
    "src/capabilities",
    "src/platform",
    "src/blog",
    "src/landing",
    "src/email",
    "src/sites",
    "src/models",
    "src/model-gateway",
    "src/cloud",
    "src/cloud-gateway",
    "src/ci",
    "src/ci-gateway",
    "src/proxies",
    "src/proxy",
    "src/ai-agents",
    "src/ai-agents-worker",
    "src/ingest",
    "src/ingest-runner",
    "src/data-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/pigeon-security/pigeon"
publish = false
