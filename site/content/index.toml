[[sections]]
id = "how"
label = "How it works"
title = "Three steps, at your pace"

[[sections.steps]]
title = "Bring it in"
text = "Add bank statements, card exports, receipts and emails. pigeon keeps each original exactly as it arrived, with the date it was added."

[[sections.steps]]
title = "See what repeats"
text = "pigeon puts everything on one timeline and points out what recurs: the same payee, the same day, the same amount. You decide what matters."

[[sections.steps]]
title = "Keep a clear record"
text = "Save what you find as a dated record with its sources attached, ready when you choose to share it with someone you trust."

[[sections]]
id = "private"
heading_id = "priv-h"
label = "Privacy"
title = "Yours, and only yours"

[[sections.rows]]
name = "Sign-in"
text = "Passkeys on your own device. No passwords to guess or reset."
status = { text = "Live", tone = "ok" }

[[sections.rows]]
name = "Approvals"
text = "Anything that changes or shares your data waits for your passkey on that exact action."
status = { text = "Live", tone = "ok" }

[[sections.rows]]
name = "Your own space"
text = "Each person gets a separate instance. Nothing is pooled with anyone else’s."
status = { text = "Live", tone = "ok" }

[[sections.rows]]
name = "Originals"
text = "Files are stored by their content and never edited, so a record can always be traced back."
status = { text = "In testing", tone = "warn" }

[[sections.rows]]
name = "Email in"
text = "A private address per person for forwarding messages and receipts."
status = { text = "Planned" }

[[sections]]
id = "hood"
label = "Under the hood"
title = "Built in the open"
text = "pigeon runs on Cloudflare Workers. Its architecture page is drawn from the deployed code on every release."

