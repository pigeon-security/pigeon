# The home page. The example record's figures are invented, and the panel says so.

[hero]
pill = { text = "Invite only", tone = "accent" }
title = "Find the pattern. Act with confidence."
lede = "pigeon is a private workspace for making sense of money records. Bring in statements, receipts and messages you already have. pigeon lines them up by date, shows what repeats, and keeps a record you can rely on."
fine = "Sign in with a passkey. pigeon is in a small private test; there is no public sign-up yet."

[[hero.actions]]
title = "Open console"
link = "https://platform.pigeon.dev/app"
style = "primary"

[[hero.actions]]
title = "How it works"
link = "#how"
style = "ghost"

