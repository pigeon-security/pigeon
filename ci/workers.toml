# Which Worker owns each path, for landing in lanes (docs/plans/workers-split.md). The Lander
# reads this file from main, never from the branch being landed, so a branch never chooses its
# own lane; a change to it is a gate change (rule `gate-changes`), like the rest of ci/.
#
# A pattern ending in `*` matches any path starting with the text before it; any other pattern
# matches exactly. docs, then shared, then checks: the first of those that matches wins.
# Otherwise a path belongs to every worker whose patterns match it (a library belongs to each
# Worker built with it), and a path nothing matches is shared. tests/smoke.rs runs the tests and
# deploys nothing by itself.
#
# The test: a path belongs to a Worker when changing it can change what that Worker runs: its
# crate and the crates it links, files compiled in (include_str!), its wrangler.toml and its
# deploy script. Anything that only the gate or CI's jobs read is a check.
version = 1

# Merged without tests or a deploy.
[docs]
paths = ["docs/*"]

# Built into every Worker, or read by every deploy: every Worker deploys.
[shared]
paths = [
    "src/core/*",
    "src/contract/*",
    # pigeon-core compiles the policy in.
    ".pigeon/policy.toml",
    "Cargo.toml",
    # A change to the workspace's own entries alone picks no lane (lanes::lock_members_only).
    "Cargo.lock",
    ".cargo/*",
    "rust-toolchain.toml",
    # Every deploy runs these.
    "ci/deploy/deploy.sh",
    "ci/deploy/allowlist.sh",
    "ci/deploy/node.sh",
    "ci/deploy/standin.mjs",
]
# Only these hold the other lanes until core has deployed them: the contract between core and
# the capability Workers, and this map, which core and the proxy build the deploy scope from.
# Any other landing's lanes, core's included, start together.
core_first = ["src/contract/*", "ci/workers.toml"]

# Tested, deployed nowhere: the gate and CI's jobs, Claude Code's settings (generated from the
# policy, checked by the gate), and the image sources, whose images the Workers pin by digest.
[checks]
paths = [
    "ci/runner/test.sh",
    "ci/runner/smoke.sh",
    "ci/runner/smoke-fail.sh",
    "ci/runner/sleep.sh",
    "ci/image/*",
    "ci/sandbox/*",
    ".pigeon/ci.toml",
    ".claude/*",
    ".gitignore",
    # The iOS app (docs/plans/ios.md): built only by macOS CI and the person's Mac; the Rust gate
    # checks its generated tokens file. No Worker deploys it.
    "ios/*",
    # The email library (docs/plans/email.md): used by no Worker yet. Move it into its Worker's
    # paths when one depends on it.
    "src/email/*",
    "src/cloud-gateway/*",
    # The data Worker and the ingest runner (docs/plans/ingest.md): not platform Workers, never
    # deployed by a landing. The ingest library they use is linked by core, so it is core's.
    "src/data-worker/*",
    "src/ingest-runner/*",
    # The DO rehearsal's destination (docs/plans/do-rehearsal.md): built and tested, never
    # deployed, until the landing that gives it a [[worker]] entry takes this line out.
    "src/dotest-b/*",
    # The pigeon.dev landing's content (docs/plans/platform-self-hosting.md): rendered only by
    # the smoke suite until the home instance publishes it.
    "site/*",
]

[[worker]]
name = "core"
script = "pigeon-platform"
dir = "src/platform"
paths = [
    "src/platform/*",
    "src/capabilities/*",
    # The crates core links, which other Workers link too.
    "src/models/*",
    "src/ci/*",
    "src/proxies/*",
    "src/blog/*",
    "src/ai-agents/*",
    # pigeon-capabilities links the ingest and cloud libraries.
    "src/ingest/*",
    "src/cloud/*",
    # Compiled in: the map (core's deploy scope) and CI's runner scripts (src/ci).
    "ci/workers.toml",
    "ci/runner/entrypoint.sh",
    "ci/runner/buildkite.sh",
]
test_job = "test"
deploy_job = "deploy"
after = ["architecture", "portal_sync"]

# The sites Worker: the blog and landing renderers and instance site deploys. A capability
# Worker behind core (docs/plans/workers-split.md, phase 2).
[[worker]]
name = "sites"
script = "pigeon-sites"
dir = "src/sites"
paths = ["src/sites/*", "src/blog/*", "src/landing/*", "ci/deploy/deploy-sites.sh"]
test_job = "test"
deploy_job = "deploy-sites"
after = ["portal_sync"]

# The model gateway Worker: model requests through the AI Gateway, usage, and the async jobs'
# class, which it hosts since the transfer. A capability Worker behind core
# (docs/plans/workers-split.md, phase 3).
[[worker]]
name = "model-gateway"
script = "pigeon-model-gateway"
dir = "src/model-gateway"
paths = ["src/model-gateway/*", "src/models/*", "ci/deploy/deploy-model-gateway.sh"]
test_job = "test"
deploy_job = "deploy-model-gateway"
after = ["portal_sync"]

# The CI gateway Worker: CI's tools and /ci/ routes behind the contract, and the scheduler's
# class since the transfer; the runners are still core's (docs/plans/workers-split.md, phase 4).
# The connectors' setup runs after its deploys: the scheduler applies it once per build, and
# it is this Worker's build, which a core deploy does not change.
[[worker]]
name = "ci-gateway"
script = "pigeon-ci-gateway"
dir = "src/ci-gateway"
paths = [
    "src/ci-gateway/*",
    "src/ci/*",
    "src/platform/wrangler.toml",
    "ci/runner/entrypoint.sh",
    "ci/runner/buildkite.sh",
    "ci/deploy/deploy-ci-gateway.sh",
]
test_job = "test"
deploy_job = "deploy-ci-gateway"
after = ["portal_sync", "connectors_setup"]
queues = ["pigeon-ci-events"]
containers = []

# The proxy Worker: /git/ and /cf/ on proxy.pigeon.dev. A capability Worker that never holds the
# parent token (docs/plans/workers-split.md, phase 6). It builds the deploy scope from core's
# wrangler.toml and this map, both compiled in.
[[worker]]
name = "proxy"
script = "pigeon-proxy"
dir = "src/proxy"
paths = [
    "src/proxy/*",
    "src/proxies/*",
    "src/platform/wrangler.toml",
    "ci/workers.toml",
    "ci/deploy/deploy-proxy.sh",
]
test_job = "test"
deploy_job = "deploy-proxy"
after = []

# The AI agents Worker: planner and executor runs inside pigeon, their sandboxes (one container
# per run) and the ai_agents_* tools. A capability Worker behind core (docs/plans/ai-agents.md).
# Its crate src/ai-agents is linked by core too.
[[worker]]
name = "ai-agents"
script = "pigeon-ai-agents"
dir = "src/ai-agents-worker"
paths = [
    "src/ai-agents-worker/*",
    "src/ai-agents/*",
    # pigeon-ai-agents links pigeon-models.
    "src/models/*",
    "ci/deploy/deploy-ai-agents.sh",
]
test_job = "test"
deploy_job = "deploy-ai-agents"
after = ["portal_sync"]
containers = ["Sandbox"]

# A throwaway Worker for the Durable Object rehearsals (docs/plans/do-rehearsal.md, "Second
# rehearsal"): the transfer's source, which later stops exporting the class. Its first deploy is
# the landing that adds this entry (the Lander deploys a Worker it adds). Its entry comes out
# once the rehearsal is done. pigeon-dotest-b's crate is in the workspace but not in this map,
# so nothing deploys it until a later landing lists it, before this entry.
[[worker]]
name = "dotest-a"
script = "pigeon-dotest-a"
dir = "src/dotest-a"
paths = ["src/dotest-a/*", "ci/deploy/deploy-dotest-a.sh"]
test_job = "test"
deploy_job = "deploy-dotest-a"
after = []
