# Which Worker owns each path, for landing in lanes (docs/plans/workers-split.md). The Lander
# reads this file from main, never from the branch being landed, so a branch never chooses its
# own lane; a change to it is a gate change (rule `gate-changes`), like the rest of ci/.
#
# A pattern ending in `*` matches any path starting with the text before it; any other pattern
# matches exactly. The first entry that matches wins: docs, then shared, then each worker in
# order; a path nothing matches is shared. tests/smoke.rs is test-shared: a change to it runs
# the tests of the Workers the landing otherwise touches, and never makes it shared.
version = 1

# Merged without tests or a deploy.
[docs]
paths = ["docs/*"]

# Every Worker's tests; deployed core first.
[shared]
paths = [
    "src/core/*",
    "src/contract/*",
    "src/models/*",
    # CI's code: core still serves it, and pigeon-ci-gateway too (phase 4).
    "src/ci/*",
    "src/proxies/*",
    "Cargo.toml",
    "Cargo.lock",
    ".cargo/*",
    "rust-toolchain.toml",
    ".pigeon/*",
    ".claude/*",
    "ci/*",
]

[[worker]]
name = "core"
script = "pigeon-platform"
dir = "src/platform"
paths = ["src/platform/*", "src/capabilities/*"]
test_job = "test"
deploy_job = "deploy"
after = ["architecture", "portal_sync", "connectors_setup"]

# The sites Worker: the blog renderer and instance site deploys. A capability Worker behind
# core (docs/plans/workers-split.md, phase 2).
[[worker]]
name = "sites"
script = "pigeon-sites"
dir = "src/sites"
paths = ["src/sites/*", "src/blog/*"]
test_job = "test"
deploy_job = "deploy-sites"
after = ["portal_sync"]

# The model gateway Worker: model requests through the AI Gateway, usage and async jobs, whose
# class core still hosts (src/models is shared: core links it). A capability Worker behind
# core (docs/plans/workers-split.md, phase 3).
[[worker]]
name = "model-gateway"
script = "pigeon-model-gateway"
dir = "src/model-gateway"
paths = ["src/model-gateway/*"]
test_job = "test"
deploy_job = "deploy-model-gateway"
after = ["portal_sync"]

# The CI gateway Worker: CI's tools and /ci/ routes behind the contract. The scheduler and the
# runners are still core's (docs/plans/workers-split.md, phase 4).
[[worker]]
name = "ci-gateway"
script = "pigeon-ci-gateway"
dir = "src/ci-gateway"
paths = ["src/ci-gateway/*"]
test_job = "test"
deploy_job = "deploy-ci-gateway"
after = ["portal_sync"]
queues = ["pigeon-ci-events"]
containers = []

# The proxy Worker: /git/ and /cf/ on proxy.pigeon.dev, with the proxies' code shared with core
# (src/proxies, so shared). A capability Worker that never holds the parent token
# (docs/plans/workers-split.md, phase 6).
[[worker]]
name = "proxy"
script = "pigeon-proxy"
dir = "src/proxy"
paths = ["src/proxy/*"]
test_job = "test"
deploy_job = "deploy-proxy"
after = []

# A throwaway Worker for the Durable Object transfer rehearsal (docs/plans/do-rehearsal.md;
# docs/plans/workers-split.md, T17): the transfer's destination. Listed before dotest-a, whose
# binding names it, so a landing that deploys both deploys it first. Its entry comes out once
# the rehearsal is done.
[[worker]]
name = "dotest-b"
script = "pigeon-dotest-b"
dir = "src/dotest-b"
paths = ["src/dotest-b/*"]
test_job = "test"
deploy_job = "deploy-dotest-b"
after = []

# A throwaway Worker for the Durable Object transfer rehearsal (docs/plans/do-rehearsal.md;
# docs/plans/workers-split.md, T17): the transfer's source. Its entry comes out once the
# rehearsal is done.
[[worker]]
name = "dotest-a"
script = "pigeon-dotest-a"
dir = "src/dotest-a"
paths = ["src/dotest-a/*"]
test_job = "test"
deploy_job = "deploy-dotest-a"
after = []
