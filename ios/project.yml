# The iOS app's XcodeGen spec. The .xcodeproj is generated, never committed.
name: Pigeon
options:
  bundleIdPrefix: dev.pigeon
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
targets:
  Pigeon:
    type: application
    platform: iOS
    sources: [Pigeon]
    scheme:
      testTargets: [PigeonTests]
    # XcodeGen writes this file from `properties` on every run.
    entitlements:
      path: Pigeon/Pigeon.entitlements
      properties:
        com.apple.developer.associated-domains: ["webcredentials:platform.pigeon.dev", "applinks:platform.pigeon.dev"]
        # Xcode's default. A distribution export takes the App Store profile's value.
        aps-environment: development
    settings:
      base:
        # Swift 5 mode: AuthenticationServices' delegates are not annotated for Swift 6 isolation.
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: Pigeon
        PRODUCT_BUNDLE_IDENTIFIER: dev.pigeon.app
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pigeon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # App Store Connect refuses a build without these (90474: iPad multitasking needs all four).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # The app icon (Assets.xcassets/AppIcon, 1024 px, the old app's), which App Store Connect requires.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The console's accent (Assets.xcassets/Theme/accent), for system controls.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: accent
  # Unit tests for logic that needs no UI (the tab layout). Run with Product › Test in Xcode.
  PigeonTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PigeonTests]
    dependencies:
      - target: Pigeon
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.pigeon.app.tests
