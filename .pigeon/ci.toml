# pigeon's CI jobs. The gateway reads this file at the commit being run; it never reads the
# scripts. See docs/plans/ci-gateway.md.

# A job that only proves the path end to end: the runner fetched this commit and ran a script.
[jobs.smoke]
run = "ci/runner/smoke.sh"
timeout_min = 5

# The same, failing on purpose: exits 1 after one line of output.
[jobs.smoke-fail]
run = "ci/runner/smoke-fail.sh"
timeout_min = 5

# pigeon's checks: fmt, clippy with warnings denied, the native tests, the platform's WASM check.
# Every commit passes them before it lands.
[jobs.test]
run = "ci/runner/test.sh"
timeout_min = 60

[jobs.test.needs]
cpu = 4
memory_gb = 12
disk_gb = 20

# A dry `wrangler deploy` with the pinned wrangler against a stand-in for the Cloudflare API: fails
# when it makes a call the deploy proxy's allowlist refuses.
[jobs.allowlist]
run = "ci/deploy/allowlist.sh"
timeout_min = 45

[jobs.allowlist.needs]
cpu = 4
memory_gb = 12
disk_gb = 20

# Deploys the platform Worker from a landed commit, through the deploy proxy with its own job
# token: only the `land` flow's deploy job can use it there. Runs the allowlist check first.
[jobs.deploy]
run = "ci/deploy/deploy.sh"
timeout_min = 60
token = true

[jobs.deploy.needs]
cpu = 4
memory_gb = 12
disk_gb = 20

# Five minutes of sleep: proves a job's container lives past its runner object going idle.
[jobs.sleep]
run = "ci/runner/sleep.sh"
timeout_min = 10

# Deploys the pigeon-sites Worker (src/sites) from a landed commit, as `deploy` deploys core: the
# Lander runs it for a landing that changed sites (ci/workers.toml).
[jobs.deploy-sites]
run = "ci/deploy/deploy-sites.sh"
timeout_min = 60
token = true

[jobs.deploy-sites.needs]
cpu = 4
memory_gb = 12
disk_gb = 20
